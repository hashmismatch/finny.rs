[package]
name = "finny_inspect_web"
version = "0.3.0"
authors.workspace = true
edition.workspace = true
repository.workspace = true
description = "A web inspector for the Finny state machines: a live statechart, the history of the dispatched events and the values of the states."
license.workspace = true
keywords = ["fsm", "state-machine", "inspector", "debugging"]
categories = ["development-tools::debugging"]
readme = "README.md"

[dependencies]
finny = { workspace = true, features = ["serde"] }
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio", "json", "query"] }
tokio = { workspace = true, features = ["rt", "net", "sync", "time", "macros"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
serde = { workspace = true, features = ["std"] }
serde_json.workspace = true
tracing = { workspace = true, features = ["std"] }

[dev-dependencies]
finny = { workspace = true, features = ["serde", "async"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
