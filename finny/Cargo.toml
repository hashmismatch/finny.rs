[package]
name = "finny"
version = "0.3.0"
authors.workspace = true
edition.workspace = true
repository.workspace = true
description = "Finite State Machines with a procedural builder-style API and compile time transition checks."
license.workspace = true
keywords = ["fsm", "state", "state-machine"]
categories = ["data-structures", "algorithms", "rust-patterns", "no-std"]
readme = "../README.md"

[dependencies]
derive_more.workspace = true
finny_derive.workspace = true
arraydeque.workspace = true
tracing = { workspace = true, optional = true }
heapless.workspace = true
tokio = { workspace = true, optional = true, features = ["sync", "time", "macros"] }
serde = { workspace = true, optional = true, features = ["alloc"] }
erased-serde = { workspace = true, optional = true, features = ["alloc"] }

[features]
default = ["std", "inspect_tracing", "timers_std"]
std = ["arraydeque/std", "timers_std", "tracing?/std", "finny_derive/std", "serde?/std", "erased-serde?/std"]
inspect_tracing = ["dep:tracing"]
timers_std = []
# The runtime description of the FSMs' structure, `finny::meta`. Requires `alloc`.
meta = ["finny_derive/meta"]
# Serialization of the FSMs' context, states and events, for FSMs that opt in with `fsm.serde()`.
serde = ["meta", "dep:serde", "dep:erased-serde", "finny_derive/serde"]
generate_plantuml = ["meta", "finny_derive/generate_plantuml"]
# Async FSMs (`FsmAsyncBuilder`), driven by the tokio runtime.
async = ["std", "dep:tokio", "serde?/rc"]

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros", "time", "test-util"] }
